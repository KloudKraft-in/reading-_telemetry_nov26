# TEL-D3-301 — local Splunk Enterprise (trial, converts to Free) in Docker. Self-contained: needs only Docker + Compose v2.
services:
  splunk:
    image: splunk/splunk:9.2.1          # pin a tag you have tested; :latest also works but is a moving target
    container_name: tel-d3-301-splunk
    hostname: splunk-d3-301
    environment:
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_PASSWORD: "${SPLUNK_PASSWORD:-Lab-Pass-301!}"
      TZ: "UTC"
    ports:
      - "8000:8000"                      # Splunk Web
    volumes:
      - ./data:/lab-data:ro              # generated logs (created by setup)
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8089/services/server/info -u admin:$${SPLUNK_PASSWORD} -o /dev/null -w '%{http_code}' | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
