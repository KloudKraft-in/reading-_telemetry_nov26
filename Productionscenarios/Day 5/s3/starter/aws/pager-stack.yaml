         "widgets": [
          {
           "type": "metric",
           "x": 0,
           "y": 0,
           "width": 6,
           "height": 6,
           "properties": {
            "metrics": [
             [
              "ShopNow",
              "CPUUtilization",
              "Seat",
              "${Seat}",
              "Host",
              "web-01"
             ]
            ],
            "view": "timeSeries",
            "stacked": false,
            "region": "${AWS::Region}",
            "stat": "Average",
            "period": 60,
            "title": "CPU average 1 min"
           }
          },
          {
           "type": "metric",
           "x": 6,
           "y": 0,
           "width": 6,
           "height": 6,
           "properties": {
            "metrics": [
