            "period": 60,
            "title": "Requests average per minute"
           }
          },
          {
           "type": "metric",
           "x": 18,
           "y": 6,
           "width": 6,
           "height": 6,
           "properties": {
            "metrics": [
             [
              "ShopNow",
              "Errors",
              "Seat",
              "${Seat}",
              "Service",
              "checkout"
             ]
