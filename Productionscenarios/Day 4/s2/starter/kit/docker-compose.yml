# TEL-D4-402 - self-contained: payment-service JSON logs -> Promtail -> Loki -> Grafana (broken panel imported by "start")
name: day4-s2
services:
  logger:
    image: python:3.12-slim
    command: ["python", "-u", "/app/payment_logger.py"]
    volumes: ["./payment_logger.py:/app/payment_logger.py:ro", "./control:/control", "logs:/logs"]
    restart: unless-stopped
  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["${BIND:-127.0.0.1}:3100:3100"]
    restart: unless-stopped
  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: ["./promtail/config.yml:/etc/promtail/config.yml:ro", "logs:/logs:ro"]
    depends_on: [loki, logger]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    ports: ["${BIND:-127.0.0.1}:3000:3000"]
    depends_on: [loki]
    restart: unless-stopped
volumes: {logs: {}, grafana-data: {}}
