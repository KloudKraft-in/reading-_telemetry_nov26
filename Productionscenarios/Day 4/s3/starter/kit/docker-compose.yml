# TEL-D4-403 - self-contained: ShopNow simulator + Prometheus + Grafana (broken SRE dashboard imported by "start")
name: day4-s3
services:
  sim:
    image: python:3.12-slim
    command: ["python", "-u", "/app/shopnow_sim.py"]
    volumes: ["./shopnow_sim.py:/app/shopnow_sim.py:ro"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=3d"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prom-data:/prometheus"]
    ports: ["${BIND:-127.0.0.1}:9090:9090"]
    depends_on: [sim]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    ports: ["${BIND:-127.0.0.1}:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
volumes: {prom-data: {}, grafana-data: {}}
