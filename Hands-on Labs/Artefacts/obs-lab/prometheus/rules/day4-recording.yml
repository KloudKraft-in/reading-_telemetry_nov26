groups:
  - name: shop-recording
    rules:
      - record: route:http_requests:rate5m
        expr: sum by (service, route) (rate(http_server_requests_total{env="lab"}[5m]))

      - record: route:http_errors:ratio_rate5m
        expr: |
          sum by (service, route) (rate(http_server_requests_total{env="lab",status=~"5.."}[5m]))
          / sum by (service, route) (rate(http_server_requests_total{env="lab"}[5m]))

      - record: route:http_latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le, service, route) (rate(http_server_request_duration_seconds_bucket{env="lab"}[5m])))

      - record: service:db_pool:utilization
        expr: max by (service) (db_pool_connections_active{env="lab"} / db_pool_connections_max{env="lab"})
