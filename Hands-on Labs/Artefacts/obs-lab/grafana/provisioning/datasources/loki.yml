# Grafana data source — Day 6: Loki with a derived field (log line → Jaeger trace) — replaces loki.yml from Day 4
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id": "(\w+)"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: View trace in Jaeger
