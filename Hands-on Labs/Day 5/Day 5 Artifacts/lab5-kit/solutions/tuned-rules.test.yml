# promtool unit tests for tuned-rules.yml (Day 5 Lab 5): run with  promtool test rules tuned-rules.test.yml
rule_files: [tuned-rules.yml]
evaluation_interval: 1m
tests:
  - name: checkout errors start at minute 6 (10 per minute next to 90 OK per minute)
    interval: 1m
    input_series:
      - series: 'http_server_requests_total{env="lab",service="frontend",route="/api/checkout",method="POST",status="201"}'
        values: '0+90x20'
      - series: 'http_server_requests_total{env="lab",service="frontend",route="/api/checkout",method="POST",status="503"}'
        values: '0x5 0+10x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CheckoutErrorRateHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: CheckoutErrorRateHigh
        exp_alerts:
          - exp_labels: {severity: critical, service: checkout, team: commerce}
            exp_annotations:
              summary: "Checkout error rate 10% (> 5 % for 2 min)"
              runbook_url: "http://localhost:9095/runbooks/RB-CHK-002.html"
  - name: shop traffic drops from about 8 req/s to 2 req/s at minute 75
    interval: 1m
    input_series:
      - series: 'http_server_requests_total{env="lab",service="frontend",route="/api/products",method="GET",status="200"}'
        values: '0+470x14 7050+490x14 14400+470x14 21450+490x14 28800+470x14 35850+120x20'
    alert_rule_test:
      - eval_time: 74m
        alertname: ShopTrafficAnomaly
        exp_alerts: []
      - eval_time: 85m
        alertname: ShopTrafficAnomaly
        exp_alerts:
          - exp_labels: {severity: warning, service: frontend, team: web-platform}
            exp_annotations:
              summary: "Shop traffic is 39.4 standard deviations away from its normal level"
              runbook_url: "http://localhost:9095/runbooks/RB-WEB-004.html"
