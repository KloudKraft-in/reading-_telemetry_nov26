global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: ["rules/*.yml"]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: shopsim
    static_configs: [{targets: ["shopsim:8000"], labels: {env: lab}}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
