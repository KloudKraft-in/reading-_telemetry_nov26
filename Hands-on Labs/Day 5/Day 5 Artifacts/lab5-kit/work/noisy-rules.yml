# The CURRENT (noisy) alert rules of the shop — reviewed in Day 5 Lab 5. Do not copy these into production.
groups:
  - name: shop-noisy
    rules:
      - alert: HighCPU
        expr: process_cpu_utilization_ratio{env="lab"} > 0.25
        labels: {severity: critical}
        annotations: {summary: "CPU high on {{ $labels.service }}"}
      - alert: AnyServerError
        expr: increase(http_server_requests_total{env="lab",status=~"5.."}[1m]) > 0
        labels: {severity: critical}
        annotations: {summary: "5xx seen on {{ $labels.service }} {{ $labels.route }}"}
      - alert: CheckoutSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{env="lab",service="frontend",route="/api/checkout"}[1m]))) > 0.2
        labels: {severity: warning}
        annotations: {summary: "Checkout p95 {{ $value }}"}
      - alert: CheckoutLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{env="lab",service="checkout"}[1m]))) > 0.2
        labels: {severity: warning}
        annotations: {summary: "Checkout service p95 {{ $value }}"}
